[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bessai"
dynamic = ["version"]
description = "Official Python SDK for the BESS AI Voice Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "BESS Analytics", email = "dev@bessai.com" },
]
keywords = ["bess", "ai", "voice", "call-center", "sdk", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/BESS-Analytics/bessai-python"
Documentation = "https://docs.bessai.com/sdk/python"
Repository = "https://github.com/BESS-Analytics/bessai-python"
Issues = "https://github.com/BESS-Analytics/bessai-python/issues"

[tool.hatch.version]
path = "bessai/_version.py"

[tool.hatch.build.targets.sdist]
include = ["bessai/", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["bessai"]

[tool.ruff]
target-version = "py38"
line-length = 120
